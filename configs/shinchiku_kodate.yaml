# ============================================================
# 新築一戸建て（売買・Phase 6）
#
# 2026-09-07 に **東京・千葉・埼玉・神奈川の全域**へ広げ、配点を
# 「通勤を下げ、設備とハザードを上げる」方向へ付け替えた（ユーザー判断 → 課題#4）。
#
# ⚠ **`cities` は空にしてある。** 空なら4都県の全市区へ自動展開され、SUUMO のスラグが
#   無い市区は黙って落ちる（実測 173/251 市区 → chuko_mansion.yaml の注記）。
# ⚠ **weight・best/worst は暫定。** 4都県の母集団で分布を測ってから確定する
#   （→ 課題#31・#34）。設備の出現率は3市区・49掲載での実測値。
#
# ⚠ **新築は「分譲地（全N区画）」が1掲載**で、価格・土地面積・建物面積・間取りが
# レンジや中黒列挙になる。価格はレンジ下限で採点し、間取りの複数表記は unknown になる
# （→ 課題#4 手順6・要件定義書 §5.4）。⚠ `unknown_policy` を drop にするとこれらが消える。
# ⚠ **`age_years` は使えない**（新築には適用されない metric）。
# ⚠ **`name:` は変えない**（→ 課題#4）。
# ============================================================

name: "新築一戸建て"
property_type: "SHINCHIKU_KODATE"

# 通知先は中古一戸建てと共有（ファミリ単位 → 課題#4）。
# ⚠⚠ 市区を広げるときは **CONFIGS_DIR を一時ディレクトリへ向けて `scan --seed`** を先に流す
webhook_ref: "KODATE"
digest_webhook_ref: "KODATE_DIGEST"

sites:
  - "SUUMO"

search:
  prefectures:
    - "東京都"
    - "千葉県"
    - "埼玉県"
    - "神奈川県"
  # 空＝4都県の全市区（スラグのある173市区）へ自動展開する
  cities: []
  price_max_hint: null
  # ⚠ サイト側MUST は無効（→ chuko_kodate.yaml の注記。`et` はバス便を丸ごと除外する）
  site_filters:
    enabled: false
    axes: []
    exclude_sites: []

commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

# ---- MUST: 広めに取ってから締める ----
must:
  price_max: 100000000         # 1億円（円単位）
  land_area_min: 40.0
  building_area_min: 50.0
  walk_minutes_max: 20
  layouts: []
  features: []
  # 所有権のみ（借地権・地上権・定期借地・一部借地を除く → 課題#65・ユーザー判断 2026-09-12）。
  # ⚠ 権利形態は詳細ページにしか出ない（新築マンションの棟は一覧の販売期の注記だけ）ので、
  #   読めない掲載は unknown で下の unknown_policy に従う（keep ＝ 残す）
  freehold_only: true
  unknown_policy: keep

# ---- WANT: 重み付き加点。合計 0〜100点へ正規化される ----
# 配点の内訳（2026-09-07・ユーザー判断）: 設備 50 / 価格 40 / 土地 15 / 建物 15 /
# 徒歩 8 / 通勤 10 / ハザード 35（洪水25・土砂10）＝ 173。
want:
  # 出現率は3市区・49掲載（2026-09-07 実測）。⚠ 出現率が高すぎる条件は入れない
  # （システムキッチン98% / モニタ付インターホン94% / 浴室乾燥機92% / 温水洗浄便座90% /
  #   都市ガス80% → 分母だけ増えて順位が動かない → 課題#15・#31）。
  # ⚠ 「省エネ性能ラベル」は等級の開示であって基準への適合ではないので入れない。
  features:
    # 購入で検討すべき材料（性能・認定）。⚠ 辞書の buy: に 2026-09-07 に追加した
    - { code: CERT_PERFORMANCE_EVAL, weight: 6 }   # 42% 住宅性能評価書（設計/建設）
    - { code: CERT_LONG_TERM_HOUSING, weight: 6 }  # 22% 長期優良住宅認定
    - { code: CERT_ENERGY_SAVING,   weight: 3 }    # 12% 省エネ基準適合・ZEH
    - { code: CERT_SEISMIC_GRADE,   weight: 3 }    #  0% 耐震等級（実測0だが定型語）
    # 後から変えられない土地・立地の条件
    - { code: EQUIP_PARKING_2,      weight: 4 }    # 34% 駐車2台以上
    - { code: LOC_CORNER_LOT,       weight: 3 }    # 20% 角地
    - { code: LOC_SOUTH_FACING,     weight: 2 }    # 51% 南向き
    - { code: LOC_TWO_SIDE_LIGHT,   weight: 3 }    # 31% 2面採光
    # 設備・仕様
    - { code: HVAC_FLOOR_HEAT,      weight: 5 }    # 35% 床暖房
    - { code: KITCHEN_DISHWASHER,   weight: 3 }    # 63% 食器洗い乾燥機
    - { code: STORAGE_WIC,          weight: 3 }    # 53% ウォークインクローゼット
    - { code: EQUIP_ROOF_BALCONY,   weight: 2 }    # 29% ルーフバルコニー
    - { code: SEC_CAMERA,           weight: 3 }    # 12% 防犯カメラ
    - { code: EQUIP_BARRIER_FREE,   weight: 1 }    # 18% バリアフリー
    # 完成済みで即入居できる（完成前の分譲地との差）
    - { code: FEAT_VACANT,          weight: 3 }    # 22% 即引渡可
  numeric:
    # best/worst は 4都県 seed 後の母集団（MUST 通過 3,876件・2026-09-08）の p10〜p90 に
    # 合わせた（→ 課題#31・#34）。⚠ 3市区時代の値だと価格の満点が 34%・建物面積の満点が 3%。
    # ⚠ 価格の weight を 40→20 へ半分にし、空いた 20 を相場比へ回した
    #    （ユーザー判断 2026-09-08「相場より安いことを重視したい」→ 課題#49 Step 6）。
    #    絶対額だけだと安い郊外が満点を取り続け、上位が埼玉県北で埋まる（→ 課題#4）。
    #    ⚠ 予算の上限は MUST の price_max が守るので、下げても予算超過は起きない。
    - { metric: price,                weight: 20, best: 30000000, worst: 72000000 }   # p10 2,990万 / p90 7,180万
    # 相場との比較（→ 課題#49・ADR 0022）。市区の㎡単価相場（国交省「不動産情報
    # ライブラリ」の取引価格）と比べる。⚠ **best/worst を 1.0 中心に置かない**——
    # うちの price は売出価格・相場は取引価格なので母集団は 1.0 をまたぐ。
    # ⚠ 価格との順位相関は r=-0.165（配線前に測ったゲート |r|<0.6 を通過）。
    - { metric: market_rate_ratio,    weight: 20, best: 0.98,     worst: 2.06 }        # p10 0.98 / p90 2.06
    - { metric: land_area_sqm,        weight: 15, best: 170,      worst: 60 }         # p90 167 / p10 61
    # ⚠ 新築戸建ての建物面積は 82〜111㎡（p10〜p90）に固まる。幅は狭いが階調は出る
    - { metric: building_area_sqm,    weight: 15, best: 110,      worst: 82 }         # p90 111 / p10 82
    - { metric: walk_minutes,         weight: 8,  best: 3,        worst: 20 }         # 0点 6%・満点 2%（据え置き）
    # 通勤は 25→10 へ（ユーザー判断 2026-09-07）。best/worst は4都県の母集団の p10〜p90
    - { metric: commute_minutes,      weight: 10, best: 45,       worst: 90 }         # p10 46 / p90 90
    # ハザード（→ ADR 0021）。戸建ては崖地の土砂災害が効くので土砂も 5→10 へ
    - { metric: flood_rank_avg,       weight: 25, best: 0,        worst: 4 }
    - { metric: landslide_area_ratio, weight: 10, best: 0,        worst: 0.1 }
    # 液状化（→ ADR 0023・課題#59）。⚠ **値は「危険ランク」で原典のレベルとは向きが逆**
    #   （生成側で rank = 6 − level と反転済み）。⚠ **best は 0 ではなく 1**
    #   ＝丁目の全面が「液状化しにくい」。0 は出ない値（レベル6＝評価対象外は除外）。
    # ⚠ weight が洪水より小さいのは、洪水との順位相関が 0.49〜0.57 で
    #   半分ほど重なるため（土砂と同格の 10 → 課題#59 決定5）。
    # ⚠ 賃貸2帯には入れない（帯が低地に集中し相関 0.70〜0.77 でゲート不通過）。
    - { metric: liquefaction_rank_avg, weight: 10, best: 1, worst: 4.5 }

ranking:
  top_n: 15
  digest_group: null
  notify_max_rank: 200
