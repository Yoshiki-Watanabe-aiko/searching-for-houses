# ============================================================
# 検索パターン YAML v2 の雛形（新築マンション）
#
# ⚠⚠ **この雛形の数値はすべて暫定である。** weight と best/worst は
# 母集団の分布を見てから決める（→ 課題#31・#34）。新築の掲載はまだ取っていないので、
# 中古の値を機械的に流用すると配点が死ぬ（築年数 worst=30 が母集団の9割に
# 張り付いた前例がある）。手順6-3 の `scan --seed` で分布を測ってから確定する。
#
# ⚠ **configs/ 直下に置かないこと。** 直下の *.yaml は実パターンとして scan が走る
#   （glob は非再帰なので examples/ は読まれない）。
#
# 検証: uv run house-search validate-config
# ============================================================

name: "新築マンション（雛形）"
property_type: "SHINCHIKU_MANSION"

# 通知先はファミリ単位で共有する（新築・中古で分けない。売買は掲載の回転が遅く
# 新着が少ないので、細分すると監視が形骸化する → 課題#4）
webhook_ref: "MANSION"
digest_webhook_ref: "MANSION_DIGEST"

sites:
  - "SUUMO"

# ---- サイト側へ渡す唯一の条件 ----
search:
  prefectures:
    - "東京都"
  # ⚠ 採点も帯に閉じる。空のままだとDBに残る帯外の掲載にも帯のスコアが付く（→ ADR 0013）
  cities: []
  # ⚠ **新築のサイト側フィルタは未測定。** 中古の mb（面積下限）・et（駅徒歩）が
  # 新築でも同じ選択肢かは分からない（同じサイト・同じキー名でも種別が違えば
  # 選択肢は別物 → 課題#4 手順4後半で mb の刻みが賃貸と売買で違った）。
  # 実測前に有効化しない（アダプタも supports_site_filters = False）
  price_max_hint: null

commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

# ---- MUST: 未充足なら除外 ----
must:
  # ⚠ **価格はレンジ下限で判定される**（要件定義書 §11.4）。棟の掲載は
  # 「8410万円～1億4690万円」のように幅を持ち、price にはその最小値が入る
  price_max: 90000000          # 9,000万円（円単位）
  monthly_cost_max: 40000
  # ⚠⚠ **棟の間取りはレンジ表記**（`1LDK～3LDK`）で **unknown になる**
  # （ユーザー判断 2026-09-06 → 要件定義書 §5.4）。fail にするとレンジ内に
  # 対象が実在するのに掲載を丸ごと除外するため。unknown_policy: keep なら通る
  layouts: ["2LDK", "3LDK"]
  # ⚠ 棟の面積もレンジで、area_sqm にはその最小値が入る
  area_min: 50.0
  walk_minutes_max: 15
  commute_minutes_max: 45
  features: []
  # ⚠⚠ **drop へ倒さないこと。** 新築は価格未定（price が NULL）・間取りレンジ・
  # 管理費未取得（棟の詳細に管理費が無い）が構造的に生じるので、
  # drop にすると**棟の掲載がまとめて消える**
  unknown_policy: keep

# ---- WANT: 重み付き加点。合計 0〜100点へ正規化される ----
want:
  # ⚠ 売買の辞書（data/feature_dictionary.yaml の buy:）はまだ空。
  # ⚠ **棟の掲載には設備原文が無い**（詳細ページに設備ブロックが存在しない）ので、
  # 設備条件を書くと棟は全件 miss になり分母にだけ乗ってスコアが沈む
  features: []
  numeric:
    # ⚠ **age_years は新築マンションに適用されない**（レジストリが弾く）。
    # 中古の雛形からコピーするとここで validate-config が落ちる
    - { metric: price,                weight: 40, best: 60000000, worst: 90000000 }
    - { metric: area_sqm,             weight: 20, best: 75,       worst: 50 }
    - { metric: monthly_cost,         weight: 10, best: 15000,    worst: 40000 }
    - { metric: walk_minutes,         weight: 10, best: 3,        worst: 15 }
    - { metric: commute_minutes,      weight: 25, best: 25,       worst: 45 }
    # ハザードは全種別で共通に効く（→ ADR 0021）
    - { metric: flood_rank_avg,       weight: 15, best: 0,        worst: 4 }
    - { metric: landslide_area_ratio, weight: 5,  best: 0,        worst: 0.1 }

ranking:
  top_n: 15
  digest_group: null
  notify_max_rank: 200
