# ============================================================
# 近郊60分圏（エリア帯2）
#
# **エリア帯**: 賃料相場が一様とみなせる地理的範囲。1パターン=1帯で、
# 帯どうしは重ならない（→ CONTEXT.md / ADR 0013）。
#
# ⚠ **行政区画では帯を切れない。** 同じ埼玉県に都心30分の川口市と
# 群馬県境の神川町が同居する。実測（2026-09-02）では4都県を1本で見た結果、
# 上位100件が本庄市・茂原市・毛呂山町など群馬/栃木県境と外房で埋まり、
# **東京の掲載が上位15件に1件も入らなかった**。そのため帯は
# 「都心までおおむね45分」で市区を選んで定義する。
#
# ⚠ **かつて「近郊45分圏」と呼んでいた帯**（→ 課題#32）。市区リストは通勤時間の
# 近似で選んだもので、NAVITIME の実ダイヤで測ると45分以内は9.7%しかなかった。
# 実態に合わせて改称し、あわせて**通勤60分以内の掲載が1件も無い4市区**
# （ふじみ野市・東村山市・国立市・清瀬市＝計261掲載）をリストから外した。
# 取っても MUST の commute_minutes_max=60 で全件落ちるため、取得が丸ごと無駄になる。
#
# ⚠ **市区を減らす方向は取り直しにならない**（既存データの採点が絞られるだけ）。
# 増やす方向は MUST 1段目で fail した掲載がDBに残っていないため取り直しになる。
#
# MUST は v2 初版のまま。実ダイヤでの MUST通過は 1,574件。
# ============================================================

name: "近郊60分圏賃貸"
property_type: "CHINTAI"
webhook_ref: "CHINTAI_ALONE"

sites:
  - "SUUMO"
  - "HOMES"      # AWS WAF に阻まれることがある（課題#17）
  - "GOO"
  - "ABLE"
  - "CHINTAI_EX" # Phase 5 で本採用。帯2でユニーク率63%・69代表
  - "ATHOME"     # パズル認証のボット検知が発動中（課題#20・is_active=false）
  - "MINIMINI"   # 未実装。HTTPでもブラウザでも reCAPTCHA を通れない（課題#18）
  - "EHEYA"
  - "NIFTY"
  - "APAMAN"     # robots.txt を無視する唯一の例外（ADR 0011）
  - "SMOCCA"     # 1ページ90件のみ取得できる（課題#22）
  - "UR"         # UR賃貸住宅。3段のJSON API(POST)で取る（ADR 0019・Phase 5F）
  - "LEOPALACE"  # レオパレス21。⚠ is_active=false（在庫が1K/1Rのみで MUST を
                 #   構造的に満たさない → 詳細設計書 §11.8）。名指しのときだけ動く
  - "DROOM"      # D-room（大和リビング）。市区の検索値がJIS5桁そのもの。
                 #   ⚠ page_num は0始まり・掲載終了が404にならない（→ 詳細設計書 §12）
  - "HOUSECOM"   # ハウスコム。⚠ 既定の並びは1ページ目が高い住戸で埋まるので
                 #   ?sort=0（家賃が安い順）を必ず付ける（→ 詳細設計書 §13.4）
  - "HOMEMATE"   # ホームメイト。市区の検索値がJIS5桁そのもの。
                 #   ⚠ robots は ClaudeBot を全面禁止だが名乗るUAには * が適用される
                 #   （ユーザー判断 2026-09-04 → §13.2）
  - "CHINTAI_NET" # CHINTAI.net。市区の検索値がJIS5桁そのもの。
                 #   ⚠⚠ 一覧に返る住戸が実行のたびに入れ替わるので「新着を確実に拾う」
                 #   ことはできない。⚠ 棟(.cassette_item)でなく住戸(tbody[data-bkkey])
                 #   を数える。⚠ 詳細の .detail_specTable は用語集の解説文が同居する
                 #   （→ 詳細設計書 §14）

search:
  prefectures:
    - "東京都"
    - "埼玉県"
    - "千葉県"
    - "神奈川県"
  cities:
    # 東京都下（中央線・西武線・京王線沿線）
    - "武蔵野市"
    - "三鷹市"
    - "調布市"
    - "狛江市"
    - "西東京市"
    - "小金井市"
    - "府中市"
    - "国分寺市"
    - "小平市"
    - "東久留米市"
    - "稲城市"
    # 埼玉県（京浜東北・埼京・東武・武蔵野線沿線）
    - "川口市"
    - "蕨市"
    - "戸田市"
    - "草加市"
    - "越谷市"
    - "朝霞市"
    - "志木市"
    - "新座市"
    - "和光市"
    - "富士見市"
    - "三郷市"
    - "八潮市"
    - "吉川市"
    # さいたま市（都心寄りの区のみ）
    - "さいたま市浦和区"
    - "さいたま市南区"
    - "さいたま市中央区"
    - "さいたま市大宮区"
    - "さいたま市北区"
    - "さいたま市見沼区"
    - "さいたま市緑区"
    - "さいたま市桜区"
    - "さいたま市西区"
    # 千葉県（総武・常磐・東西線沿線）
    - "市川市"
    - "船橋市"
    - "松戸市"
    - "浦安市"
    - "習志野市"
    - "鎌ケ谷市"
    - "流山市"
    - "柏市"
    # 川崎市
    - "川崎市川崎区"
    - "川崎市幸区"
    - "川崎市中原区"
    - "川崎市高津区"
    - "川崎市宮前区"
    - "川崎市多摩区"
    - "川崎市麻生区"
    # 横浜市（東急・京浜東北・横浜線沿線の区のみ）
    - "横浜市鶴見区"
    - "横浜市港北区"
    - "横浜市神奈川区"
    - "横浜市西区"
    - "横浜市中区"
    - "横浜市保土ケ谷区"
    - "横浜市南区"
    - "横浜市港南区"
    - "横浜市都筑区"
    - "横浜市青葉区"
    - "横浜市緑区"
  # MUST上限 70,000円 の約1.3倍。管理費が別計上のサイトで
  # 「賃料は上限内だが管理費込みだと超える」掲載を取りこぼさないためのバッファ
  price_max_hint: 90000

  # MUST をサイト側のフォームにも渡す（→ ADR 0015）。
  # WANT は渡さない（渡すと加点対象の掲載が除外されて順位に現れない）。
  # 実測（2026-09-03・足立区）: SUUMO の母集団が 62,030 → 27,150件（57%削減）。
  # ⚠ 無効値は HTTP 200 のまま0件やエラーページになる（→ 課題#29）ので、
  #   事故が起きたら enabled: false に戻せば全サイトが従来の動作へ戻る。
  site_filters:
    enabled: true
    axes: ["area_min", "walk_minutes_max", "layouts"]
    exclude_sites: []

# ---- 通勤時間の基準（→ Phase 5C・ADR 0016）----
# ⚠ 測るのは**駅から駅まで**。駅までの徒歩は walk_minutes_max（MUST）と
# walk_minutes（WANT weight 15）で独立に効いており、足すと二重に不利になる。
# ⚠ 所要時間は Google Maps ではなく駅データ.jp の接続情報からの自前計算。
# Routes API・Directions API とも日本の公共交通経路を返さない（実測）。
commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

must:
  rent_total_max: 70000
  # ⚠ 3DK は UR賃貸で最多の間取り（2026-09-03 実測: 空室33件中8件）。2DK と 3LDK が
  # 対象なのに**その間だけ**外れており、賃料・面積・徒歩をすべて満たす掲載が
  # 間取りだけで落ちていた（習志野台 67,050円・50㎡・徒歩9分 → 課題#37）。
  # ⚠ UR 専用ではなく**全サイトに効く**。既存DBは 2DK 5,157件・3LDK 257件なので
  # 他サイトからも数百件規模で母集団が増える。
  # ⚠ 緩める方向なので取り直しになる（MUST 1段目で fail した掲載はDBに残らない）。
  layouts: ["1LDK", "2K", "2DK", "2LDK", "3DK", "3LDK"]
  area_min: 30.0
  walk_minutes_max: 20
  # 通勤時間の上限（分・駅から駅）。徒歩は walk_minutes_max で別に効く
  commute_minutes_max: 60
  features: []
  unknown_policy: keep

# ---- WANT: 重み付き加点（設備 110 / 数値 90）----
want:
  features:
    # 生活の質に直結し、無いと日常的に困るもの
    - { code: INT_LAUNDRY,          weight: 10 }   # 室内洗濯機置場
    - { code: BATH_SEPARATE,        weight: 9 }    # バス・トイレ別
    - { code: KITCHEN_2BURNER,      weight: 9 }    # コンロ2口以上
    # 後から追加できないもの・強く欲しいもの
    - { code: SEC_AUTOLOCK,         weight: 8 }    # オートロック
    - { code: INT_WASHROOM,         weight: 7 }    # 洗面所独立
    - { code: EQUIP_DELIVERY_BOX,   weight: 7 }    # 宅配ボックス
    # あると嬉しいもの
    - { code: HVAC_AC,              weight: 6 }    # エアコン付き
    # RC と SRC は同時に満たしえない排他選択。別々に weight を振ると
    # 片方が必ず miss になるのに分母には両方が乗り、スコア上限が構造的に下がる
    - { any_of: [STRUCT_RC, STRUCT_SRC], weight: 6 }
    - { code: KITCHEN_GAS,          weight: 5 }    # ガスコンロ対応
    - { code: SEC_MONITOR_INTERCOM, weight: 5 }    # TVモニタ付きインターホン
    - { code: COMM_NET_FREE,        weight: 5 }    # インターネット無料
    - { code: LOC_FLOOR_2UP,        weight: 5 }    # 2階以上
    # UR は礼金・仲介手数料・更新料が制度上ゼロ（→ ADR 0019）。⚠ rent_total だけで
    # 比べると初期費用の有利さがスコアに1点も現れないので、ここで配点する。
    # UR 専用ではなく、他サイトの礼金なし物件にも同じだけ効く
    - { code: PRICE_NO_REIKIN,      weight: 5 }    # 礼金なし
    # 小さな加点
    - { code: EQUIP_TRASH_24H,      weight: 4 }    # 24時間ゴミ出し可
    - { code: INT_FLOORING,         weight: 4 }    # フローリング
    - { code: EQUIP_CITY_GAS,       weight: 4 }    # 都市ガス（プロパンとの月額差）
    - { code: COMM_FIBER,           weight: 3 }    # 光ファイバー
    - { code: STORAGE_SHOE,         weight: 3 }    # シューズボックス
    - { code: EQUIP_BICYCLE,        weight: 3 }    # 駐輪場あり
    - { code: PRICE_NO_GUARANTOR,   weight: 3 }    # 保証人不要
    # 誤差程度
    - { code: MOVEIN_IMMEDIATE,     weight: 2 }    # 即入居可
    - { code: FEAT_RENOVATED,       weight: 2 }    # リノベーション物件
    - { code: MOVEIN_INSTRUMENT,    weight: 2 }    # 楽器相談可
    - { code: EQUIP_PARKING,        weight: 1 }    # 駐車場あり

  # worst は MUST の上限／下限に一致させてある。
  # MUST ぎりぎりの掲載は該当metricが0点になり、余裕のあるものほど加点される
  numeric:
    - { metric: rent_total,   weight: 40, best: 50000, worst: 70000 }
    - { metric: area_sqm,     weight: 20, best: 45,    worst: 30 }
    # worst は母集団の実態に合わせる。30年にすると築30年以上が全部0点になり、
    # 母集団の9割（中央値 築38〜40年）が張り付いて weight 15 が死ぬ（実測）
    - { metric: age_years,    weight: 15, best: 0,     worst: 50 }
    # 徒歩は 15 → 10 へ下げ、その分を通勤時間へ回した。どちらも「移動時間」の軸で、
    # 別々に大きな重みを持たせると二重に効く（→ 2026-09-03 ユーザー確定）
    - { metric: walk_minutes, weight: 10, best: 3,     worst: 20 }
    # 通勤時間（芝公園まで・駅から駅）。実ダイヤ（→ Phase 5D）の母集団は 25〜80分で、
    # MUST 60分を通る1,569件は 48〜58分に密集している。
    # ⚠ best=35 だと満点が1.5%しか出ず上端が実質使われない。密集帯に15分幅の
    # 傾斜が乗る best=40 にした（満点7.3% / 0点7.3%で対称）
    - { metric: commute_minutes, weight: 25, best: 40, worst: 60 }

ranking:
  top_n: 15
  digest_group: "賃貸"
