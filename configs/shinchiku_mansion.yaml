# ============================================================
# 新築マンション（売買・Phase 6）
#
# 2026-09-07 に **東京・千葉・埼玉・神奈川の全域**へ広げ、配点を
# 「通勤を下げ、ハザードを上げる」方向へ付け替えた（ユーザー判断 → 課題#4）。
#
# ⚠ **`cities` は空にしてある。** 空なら4都県の全市区へ自動展開され、SUUMO のスラグが
#   無い市区は黙って落ちる（実測 173/251 市区 → chuko_mansion.yaml の注記）。
# ⚠ **設備は配点しない**（ユーザー判断 2026-09-07）。**棟の掲載には設備原文が無い**
#   （詳細ページに設備ブロックが存在しない → 課題#4 手順6-1）ので、設備条件を書くと
#   棟は全件 miss になり分母にだけ乗って構造的に沈む。個別住戸のデータが増えてから判断する。
# ⚠ **weight・best/worst は暫定。** 4都県の母集団で分布を測ってから確定する（→ 課題#31・#34）。
#
# ⚠ **MUST は「広めに取ってから締める」**（中古マンションと同じ手順 → ADR 0013・課題#24）。
# ⚠ **`name:` は変えない。** 通知履歴・順位・スコアが `pattern_name` に紐づいている（→ 課題#4）。
# ============================================================

name: "新築マンション"
property_type: "SHINCHIKU_MANSION"

# 通知先はファミリ単位で共有する（新築・中古で分けない → 課題#4）。
# ⚠⚠ 市区を広げるときは **CONFIGS_DIR を一時ディレクトリへ向けて `scan --seed`** を
#   先に流す（配置した瞬間から定期スキャンが新規掲載を通知として飛ばす → ADR 0006）
webhook_ref: "MANSION"
digest_webhook_ref: "MANSION_DIGEST"

# ⚠ ライフルホームズは入れない。1実行5リクエストの上限を賃貸と食い合う（→ 課題#4）
sites:
  - "SUUMO"

# ---- サイト側へ渡す唯一の条件 ----
search:
  prefectures:
    - "東京都"
    - "千葉県"
    - "埼玉県"
    - "神奈川県"
  # 空＝4都県の全市区（スラグのある173市区）へ自動展開する
  cities: []
  # ⚠ **価格上限はサイトへ渡さない。** 新築の `kt` の選択肢は未測定（同じサイト・
  # 同じキー名でも種別が違えば選択肢は別物 → 課題#4 手順4後半）
  price_max_hint: null
  # ⚠ **サイト側MUSTは有効にしない。** 新築の `mb` / `et` は効きが未測定で、
  # アダプタも `supports_site_filters = False` を宣言している（→ ADR 0015）

commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

# ---- MUST: 未充足なら除外 ----
# ⚠ 広めに取る。`monthly_cost_max` / `commute_minutes_max` は**意図的に設定していない**。
# 棟の詳細ページには管理費が無い（→ 課題#4 手順6-1）ので、上限を置くと
# `unknown` が増えるだけで意味がない。
must:
  # ⚠ **価格はレンジ下限で判定される**（要件定義書 §11.4）。棟の掲載は
  # 「8410万円～1億4690万円」のように幅を持ち、`price` にはその最小値が入る。
  # ⚠ **価格未定は `price` が NULL** なので MUST は `unknown` になり、
  # `unknown_policy: keep` の下で通る（これを壊さないことが手順6-3 の完了条件）
  price_max: 200000000         # 2億円（円単位）。新築は中古より高いので広めに取る
  area_min: 30.0
  walk_minutes_max: 20
  # ⚠⚠ **棟の間取りはレンジ表記**（`1LDK～3LDK`）で **unknown になる**
  # （ユーザー判断 2026-09-06 → 要件定義書 §5.4）
  layouts: []
  features: []
  # ⚠⚠ **drop へ倒さないこと。** 新築は価格未定（price が NULL）・間取りレンジ・
  # 管理費未取得（棟の詳細に管理費が無い）が構造的に生じるので、
  # drop にすると**棟の掲載がまとめて消える**
  unknown_policy: keep

# ---- WANT: 重み付き加点。合計 0〜100点へ正規化される ----
# 配点の内訳（2026-09-07・ユーザー判断）: 価格 40 / 面積 20 / 管理費等 10 / 徒歩 8 /
# 通勤 10 / ハザード 35（洪水25・土砂10）＝ 123。設備は上の理由で 0。
want:
  features: []
  numeric:
    # ⚠ **age_years は新築マンションに適用されない**（レジストリが弾く）。
    # 中古のパターンからコピーするとここで validate-config が落ちる
    # best/worst は 4都県 seed 後の母集団（MUST 通過 752件・2026-09-08）の p10〜p90 に
    # 合わせた（→ 課題#31・#34）。⚠ 新築Mは価格レンジの下限で採点される（→ 要件定義書 §11.4）
    - { metric: price,                weight: 20, best: 40000000, worst: 180000000 }  # p10 4,000万 / p90 1.78億
    # 相場との比較（→ 課題#49・ADR 0022）。市区の㎡単価相場（国交省「不動産情報
    # ライブラリ」の取引価格）と比べる。⚠ **best/worst を 1.0 中心に置かない**——
    # うちの price は売出価格・相場は取引価格なので母集団は 1.0 をまたぐ。
    # ⚠ 価格との順位相関は r=-0.039（配線前に測ったゲート |r|<0.6 を通過）。
    # ⚠⚠ **新築は中古マンションの相場と比べている**（新築の取引は原典に
    #    ほとんど載らない）。中央 1.96 という水準の高さはこの偏りを含むが、
    #    パターン内の相対比較としては機能する（p10〜p90 に合わせてあるため）。
    - { metric: market_rate_ratio,    weight: 20, best: 1.25,     worst: 3.05 }        # p10 1.25 / p90 3.05
    - { metric: area_sqm,             weight: 20, best: 75,       worst: 38 }         # p90 74.6 / p10 38.1
    # ⚠ 棟には管理費が無いので大半が missing になる（実測 397/752・分母から除外される）
    - { metric: monthly_cost,         weight: 10, best: 18000,    worst: 50000 }      # p10 1.8万 / p90 4.9万
    - { metric: walk_minutes,         weight: 8,  best: 3,        worst: 20 }         # 0点 1%・満点 22%（据え置き）
    # 通勤は 25→10 へ（ユーザー判断 2026-09-07）。best/worst は4都県の母集団の p10〜p90
    - { metric: commute_minutes,      weight: 10, best: 20,       worst: 70 }         # p10 20 / p90 69
    # ハザードは全種別で共通に効く（→ ADR 0021）。購入では住み替えが利かないので
    # 賃貸（15＋5）より重くする
    - { metric: flood_rank_avg,       weight: 25, best: 0,        worst: 4 }
    - { metric: landslide_area_ratio, weight: 10, best: 0,        worst: 0.1 }

ranking:
  top_n: 15
  digest_group: null
  notify_max_rank: 200
