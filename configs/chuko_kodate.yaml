# ============================================================
# 中古一戸建て（売買・Phase 6）
#
# 2026-09-07 に **東京・千葉・埼玉・神奈川の全域**へ広げ、配点を
# 「通勤を下げ、設備とハザードを上げる」方向へ付け替えた（ユーザー判断 → 課題#4）。
#
# ⚠ **`cities` は空にしてある。** 空なら4都県の全市区へ自動展開され、SUUMO のスラグが
#   無い市区は黙って落ちる（実測 173/251 市区 → chuko_mansion.yaml の注記）。
# ⚠ **weight・best/worst は暫定。** 4都県の母集団で分布を測ってから確定する
#   （→ 課題#31・#34）。設備の出現率は3市区・48掲載での実測値。
#
# ⚠ **MUST は「広めに取ってから締める」**（→ ADR 0013・課題#24）。
# ⚠ **`name:` は変えない**（→ 課題#4）。
# ⚠ **戸建てに area_sqm は使えない。** 専有面積という概念が無く、
# 土地面積（land_area_sqm）と建物面積（building_area_sqm）の2軸になる（→ 再設計計画 §4.5）。
# ============================================================

name: "中古一戸建て"
property_type: "CHUKO_KODATE"

# 通知先はファミリ単位で共有する（新築・中古で分けない → 課題#4）。
# ⚠⚠ 市区を広げるときは **CONFIGS_DIR を一時ディレクトリへ向けて `scan --seed`** を
#   先に流す（配置した瞬間から定期スキャンが新規掲載を通知として飛ばす → ADR 0006）
webhook_ref: "KODATE"
digest_webhook_ref: "KODATE_DIGEST"

# ⚠ ライフルホームズは入れない（賃貸の市区ローテーションと取得枠を食い合う → 課題#4）
sites:
  - "SUUMO"

# ---- サイト側へ渡す唯一の条件 ----
search:
  prefectures:
    - "東京都"
    - "千葉県"
    - "埼玉県"
    - "神奈川県"
  # 空＝4都県の全市区（スラグのある173市区）へ自動展開する
  cities: []
  # ⚠ **価格上限はサイトへ渡さない**（戸建ての `kt` は効くが丸めが未実装 → 課題#29）
  price_max_hint: null
  # ⚠ **サイト側MUST は無効**（→ 課題#4 手順8 の実測）。土地・建物面積の選択肢は
  # 60㎡からで現行 MUST（40・50）では絞れず、駅徒歩 `et` は**バス便を丸ごと除外する**ので
  # ローカルの MUST（unknown → keep）より厳しくなり ADR 0015 の不変条件を破る
  site_filters:
    enabled: false
    axes: []
    exclude_sites: []

commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

# ---- MUST: 未充足なら除外 ----
# ⚠ 広めに取る。`age_max` / `commute_minutes_max` / `layouts` は**意図的に設定していない**。
# ⚠ **`walk_minutes_max` は当面 20 のまま**。バス便が過半数（八王子で11/20）で
# `walk_minutes` が NULL になる掲載は unknown → `keep` で通る（ユーザー判断 2026-09-07・現状維持）
must:
  price_max: 100000000         # 1億円（円単位）
  land_area_min: 40.0          # ⚠ 23区の狭小3階建て（土地40〜60㎡）を落とさない
  building_area_min: 50.0
  walk_minutes_max: 20
  layouts: []                  # 制約なし
  features: []
  # ⚠ drop へ倒さないこと。バス便の徒歩不明・間取りレンジが「情報が無いだけ」で消える
  unknown_policy: keep

# ---- WANT: 重み付き加点。合計 0〜100点へ正規化される ----
# 配点の内訳（2026-09-07・ユーザー判断）: 設備 50 / 価格 40 / 土地 15 / 建物 15 /
# 築年 15 / 徒歩 8 / 通勤 10 / ハザード 35（洪水25・土砂10）＝ 188。
want:
  # 出現率は3市区・48掲載（2026-09-07 実測）。⚠ 出現率が高すぎる条件は入れない
  # （都市ガス81% / システムキッチン79% → 分母だけ増えて順位が動かない → 課題#15・#31）。
  # ⚠ 証明書系（CERT_*）は出現率が低くてもよい。希少な属性ほど差がつく
  features:
    # 購入後の費用に直結するもの
    - { any_of: [FEAT_REFORMED, FEAT_RENOVATED], weight: 6 }   # 31% / 10%（排他）
    - { code: STRUCT_QUAKE,         weight: 5 }    #  2% 耐震基準適合（ローン控除・築古の要）
    - { code: CERT_DEFECT_INSURANCE, weight: 3 }   #  4% 既存住宅売買瑕疵保険
    - { code: CERT_INSPECTION,      weight: 2 }    #  0% 建物状況調査（実測0だが定型語）
    # 後から変えられない土地・立地の条件
    - { code: EQUIP_PARKING_2,      weight: 4 }    # 25% 駐車2台以上
    - { code: LOC_CORNER_LOT,       weight: 3 }    # 12% 角地
    - { code: LOC_SOUTH_FACING,     weight: 3 }    # 62% 南向き
    - { code: LOC_TWO_SIDE_LIGHT,   weight: 3 }    # 23% 2面採光
    # 住み始めるまでの手間・設備
    - { code: FEAT_VACANT,          weight: 4 }    # 35% 現況空家（即引渡し可）
    - { code: KITCHEN_DISHWASHER,   weight: 4 }    # 27% 食器洗い乾燥機
    - { code: HVAC_FLOOR_HEAT,      weight: 4 }    # 13% 床暖房
    - { code: STORAGE_WIC,          weight: 3 }    # 17% ウォークインクローゼット
    - { code: EQUIP_ROOF_BALCONY,   weight: 2 }    # 10% ルーフバルコニー
    # 出現率が高いので軽め
    - { code: BATH_DRY,             weight: 2 }    # 60% 浴室乾燥機
    - { code: SEC_MONITOR_INTERCOM, weight: 2 }    # 62% TVモニタ付きインターホン
  numeric:
    # best/worst は 4都県 seed 後の母集団（MUST 通過 7,988件・2026-09-08）の p10〜p90 に
    # 合わせた（→ 課題#31・#34）。⚠ 3市区時代の値だと価格の満点が 35%・土地の満点が 42%。
    # ⚠ 価格は絶対額なので郊外が満点を取り続ける（相場比が入るまでの既知の限界 → 課題#49）
    - { metric: price,                weight: 40, best: 18000000, worst: 70000000 }   # p10 1,780万 / p90 7,000万
    - { metric: land_area_sqm,        weight: 15, best: 200,      worst: 60 }         # p90 197 / p10 58
    - { metric: building_area_sqm,    weight: 15, best: 130,      worst: 72 }         # p90 129 / p10 72
    # 築年は best 0 を保ち worst だけ p90 へ（賃貸の課題#31 と同じ手順）
    - { metric: age_years,            weight: 15, best: 0,        worst: 45 }         # p90 43
    - { metric: walk_minutes,         weight: 8,  best: 3,        worst: 20 }         # 0点 6%・満点 2%（据え置き）
    # 通勤は 25→10 へ（ユーザー判断 2026-09-07）。best/worst は4都県の母集団の p10〜p90
    - { metric: commute_minutes,      weight: 10, best: 40,       worst: 90 }         # p10 40 / p90 88
    # ハザードは全種別で共通に効く（→ ADR 0021）。戸建ては崖地の土砂災害が効くので
    # 土砂も 5→10 へ。⚠ 0 は「区域外だと確認した」で満点、未解決は欠損
    - { metric: flood_rank_avg,       weight: 25, best: 0,        worst: 4 }
    - { metric: landslide_area_ratio, weight: 10, best: 0,        worst: 0.1 }

ranking:
  top_n: 15
  digest_group: null
  notify_max_rank: 200
