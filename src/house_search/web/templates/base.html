<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}物件ランキング{% endblock %} | 物件検索</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url_for('web.index') }}">物件ランキング</a>
  <nav class="site-nav" aria-label="検索パターン">
    {% for nav_slug, nav_name in nav_patterns %}
    <a href="{{ url_for('web.ranking', slug=nav_slug) }}"{% if slug is defined and slug == nav_slug %} aria-current="page"{% endif %}>{{ nav_name }}</a>
    {% endfor %}
  </nav>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">ローカル閲覧専用（127.0.0.1）。採点・順位は定期スキャンの保存値をそのまま表示しています。</footer>
</body>
</html>
