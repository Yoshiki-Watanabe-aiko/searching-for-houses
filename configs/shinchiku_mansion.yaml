# ============================================================
# 新築マンション（売買・Phase 6 手順6-3 の縦切り実測）
#
# ⚠⚠ **weight と best/worst は暫定値である。** 新築の掲載はまだ1件も無いので、
# 母集団の分布を見てから確定する（→ 課題#31・#34）。中古の値を機械的に流用すると
# 配点が死ぬ（築年数 worst=30 が母集団の9割に張り付いた前例がある）。
#
# ⚠ **MUST は「広めに取ってから締める」**（中古マンションと同じ手順 → ADR 0013・課題#24）。
# MUST 1段目で fail した掲載はDBに残らないので、**緩める方向は取り直しになる**。
# 締める方向は `rescore` だけで試せる。
#
# ⚠ **`name:` は変えない。** 通知履歴・順位・スコアが `pattern_name` に紐づいており、
# 変えると全掲載が「未通知」扱いになり new が全件再発火する（→ 課題#4）。
# ============================================================

name: "新築マンション"
property_type: "SHINCHIKU_MANSION"

# 通知先はファミリ単位で共有する（新築・中古で分けない → 課題#4）。
# ⚠⚠ `.env` の DISCORD_WEBHOOK_MANSION / _MANSION_DIGEST には**既に値が入っている**
# （2026-09-07 実測。以前の「キーだけで値が空」という記述は古い）。
# ⚠ **つまり configs/ 直下に置いた瞬間から、定期スキャン（`--seed` なし）が
# 新規掲載を通知として飛ばす。** 初回は必ず `scan --seed` でDBへ入れてから
# 配置すること（→ ADR 0006）。
# （`scan --seed` は通知しないので通知先の解決も走らない。cli.py の fail-fast は
# `if not args.seed:`）。
webhook_ref: "MANSION"
digest_webhook_ref: "MANSION_DIGEST"

# ⚠ ライフルホームズは入れない。1実行5リクエストの上限を賃貸と食い合う（→ 課題#4）
sites:
  - "SUUMO"

# ---- サイト側へ渡す唯一の条件 ----
search:
  prefectures:
    - "東京都"
  # ⚠ **市区は「価格未定の棟が実在すると実測済みの市区」から選んである。**
  # 手順6-3 の完了条件は「価格未定が MUST・採点・通知を壊さないこと」なので、
  # 価格未定を1件も含まない市区で流しても検証にならない。
  #   板橋区 … 手順6 の着手前実測で10棟中 **16件が価格未定**（フィクスチャあり）
  #   港区   … 同 18棟＋個別住戸12件。**棟と住戸の混在**を確かめられる（フィクスチャあり）
  #   八王子市 … 郊外。⚠ 都心だけだと**バス便を含まず駅同定の欠陥を検出できない**
  #              （課題#41・#44 で2度踏んだ形。中古Mでバス便3件を実測済み）
  # ⚠ 市区を増やす方向は取り直しになる（MUST 1段目で fail した掲載はDBに残らない）が、
  # 下記の MUST は広めなので、増やした市区が新規に取得されるだけで済む。
  cities:
    - "板橋区"
    - "港区"
    - "八王子市"
  # ⚠ **価格上限はサイトへ渡さない。** 中古の `kt` は単位が万円で選択肢が離散だと
  # 手順3で実測したが、**新築で同じ選択肢かは未測定**（同じサイト・同じキー名でも
  # 種別が違えば選択肢は別物 → 課題#4 手順4後半で `mb` の刻みが賃貸と売買で違った）。
  price_max_hint: null
  # ⚠ **サイト側MUSTは有効にしない。** 新築の `mb` / `et` は効きが未測定で、
  # アダプタも `supports_site_filters = False` を宣言している（→ ADR 0015）。
  # 測っていないものは送らない

commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

# ---- MUST: 未充足なら除外 ----
# ⚠ 広めに取る。`monthly_cost_max` / `commute_minutes_max` は**意図的に設定していない**。
# 棟の詳細ページには管理費が無い（→ 課題#4 手順6-1）ので、上限を置くと
# `unknown` が増えるだけで意味がない。分布を見てから締める。
must:
  # ⚠ **価格はレンジ下限で判定される**（要件定義書 §11.4）。棟の掲載は
  # 「8410万円～1億4690万円」のように幅を持ち、`price` にはその最小値が入る。
  # ⚠ **価格未定は `price` が NULL** なので MUST は `unknown` になり、
  # `unknown_policy: keep` の下で通る（これを壊さないことが手順6-3 の完了条件）
  price_max: 200000000         # 2億円（円単位）。新築は中古より高いので広めに取る
  area_min: 30.0
  walk_minutes_max: 20
  # ⚠⚠ **棟の間取りはレンジ表記**（`1LDK～3LDK`）で **unknown になる**
  # （ユーザー判断 2026-09-06 → 要件定義書 §5.4）。ここでは制約なしにしてあるので
  # 判定自体が走らないが、締めるときはレンジ表記の扱いを思い出すこと
  layouts: []
  features: []
  # ⚠⚠ **drop へ倒さないこと。** 新築は価格未定（price が NULL）・間取りレンジ・
  # 管理費未取得（棟の詳細に管理費が無い）が構造的に生じるので、
  # drop にすると**棟の掲載がまとめて消える**
  unknown_policy: keep

# ---- WANT: 重み付き加点。合計 0〜100点へ正規化される ----
want:
  # ⚠ 売買の辞書（data/feature_dictionary.yaml の buy:）はまだ空。
  # ⚠ **棟の掲載には設備原文が無い**（詳細ページに設備ブロックが存在しない
  # → 課題#4 手順6-1）ので、設備条件を書くと棟は全件 miss になり
  # 分母にだけ乗ってスコアが沈む
  features: []
  numeric:
    # ⚠ **age_years は新築マンションに適用されない**（レジストリが弾く）。
    # 中古のパターンからコピーするとここで validate-config が落ちる
    - { metric: price,                weight: 40, best: 50000000, worst: 200000000 }
    - { metric: area_sqm,             weight: 20, best: 75,       worst: 30 }
    # ⚠ 棟には管理費が無いので大半が missing になる見込み（分母から除外される）
    - { metric: monthly_cost,         weight: 10, best: 15000,    worst: 40000 }
    - { metric: walk_minutes,         weight: 10, best: 3,        worst: 20 }
    - { metric: commute_minutes,      weight: 25, best: 25,       worst: 60 }
    # ハザードは全種別で共通に効く（→ ADR 0021）
    - { metric: flood_rank_avg,       weight: 15, best: 0,        worst: 4 }
    - { metric: landslide_area_ratio, weight: 5,  best: 0,        worst: 0.1 }

ranking:
  top_n: 15
  digest_group: null
  notify_max_rank: 200
