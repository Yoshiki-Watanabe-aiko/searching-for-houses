# ============================================================
# サイト側の絞り込みパラメータ（MUST 限定）
#
# このファイルが正典。`house-search sync-site-params` で
# m_site_search_params へ同期し、実行時はDBから読む
# （data/feature_dictionary.yaml と同じ構成）。
#
# 【送ってよいもの】数値系の MUST と間取りだけ（→ ADR 0015）。
# 設備条件（must.features）は**永久に送らない**。辞書抽出とサイトのタグ付けは
# 判定が食い違い、こちらが unknown として残したい掲載をサイトが落としてしまう。
#
# 【賃料上限は含めない】search.price_max_hint の経路が既に担っており、
# 軸を足すと同じURLパラメータに供給源が2つできる。
#
# 【丸めの向きはここに書かない】軸の意味から決まるので
# scrape/params.py の AXIS_BOUND で一元管理する
# （上限は切り上げ・下限は切り下げ・集合は全項目を表現できるときだけ送る）。
#
# ⚠ **値は必ず実測してから書く。** 選択肢を外すと HTTP 200 のまま
# 0件やエラーページが返り、例外にならない（→ 課題#29）。
# ============================================================

version: 1

sites:
  # ----------------------------------------------------------
  # SUUMO（実測 2026-09-03・足立区 sc=13121・基準 62,030件）
  #
  # 検証方法: 存在しないキー zzz=1 を送ると件数が 62,030 のまま変わらないことを
  # 先に確かめ、「件数が動く＝キーが認識されている」と言えるようにしてから測った。
  #
  #   mb=30  -> 31,861件   mt=40 -> 39,386件
  #   et=10  -> 41,405件   cn=10 -> 43,750件
  #   md=04  -> 14,410件（1LDK）
  #
  # ⚠ et=12（選択肢に無い値）は **title が「エラー｜SUUMO(スーモ)」の
  #   11KBのページを HTTP 200 で返す**。掲載0件になるだけで例外にならないため、
  #   アダプタ側でこのページを判別して例外にしている。
  # ----------------------------------------------------------
  SUUMO:
    CHINTAI:
      area_min:
        param: mb
        kind: stepped
        unit: sqm
        enabled: true
        spec: { min: 20, max: 100, step: 5, format: "{:.0f}" }
        notes: "専有面積の下限（㎡）。20〜100の5刻み。実測 mb=30 で 31,861件"

      area_max:
        param: mt
        kind: stepped
        unit: sqm
        enabled: true
        spec: { min: 20, max: 100, step: 5, format: "{:.0f}" }
        notes: "専有面積の上限（㎡）。20〜100の5刻み。実測 mt=40 で 39,386件"

      walk_minutes_max:
        param: et
        kind: enum
        unit: minutes
        enabled: true
        spec: { choices: [1, 5, 7, 10, 15, 20], format: "{:.0f}" }
        notes: "駅徒歩の上限（分）。実測 et=10 で 41,405件 / et=12 はエラーページ"

      age_max:
        param: cn
        kind: enum
        unit: years
        enabled: true
        spec: { choices: [1, 3, 5, 7, 10, 15, 20, 25, 30], format: "{:.0f}" }
        notes: "築年数の上限（年）。実測 cn=10 で 43,750件"

      layouts:
        param: md
        kind: multi
        unit: minutes # multi では使わない（換算しないため）
        enabled: true
        spec:
          # 実測でS付き（1SLDK 等）も含まれることを確認済み。
          # サイト側が上位集合を返すぶんには取りこぼさないので安全。
          mapping:
            ワンルーム: "01"
            1K: "02"
            1DK: "03"
            1LDK: "04"
            2K: "05"
            2DK: "06"
            2LDK: "07"
            3K: "08"
            3DK: "09"
            3LDK: "10"
            4K: "11"
            4DK: "12"
            4LDK: "13"
        notes: >-
          間取り。実測で 04=1LDK(1SLDK含む) / 05=2K / 06=2DK /
          07=2LDK(2SLDK含む) / 10=3LDK(3SLDK含む) を確認した。
          14（5K以上）は「以上」で境界が曖昧なため対応表に入れていない。
          対応表に無い間取りが1つでもあれば軸ごと送らない仕様なので、
          5K以上を MUST に入れると間取りの絞り込みは自動的に無効になる。
