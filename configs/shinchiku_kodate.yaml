# ============================================================
# 新築一戸建て（売買・Phase 6 手順8 の縦切り実測）
#
# ⚠⚠ **weight と best/worst は暫定値である。** 戸建ての掲載はまだ1件も無いので、
# 母集団の分布を見てから確定する（→ 課題#31・#34）。
#
# ⚠ **新築は「分譲地（全N区画）」が1掲載**で、価格・土地面積・建物面積・間取りが
# レンジや中黒列挙になる（`4960万円～4980万円` / `120.17m2・120.18m2` /
# `3LDK・3LDK+S（納戸）`）。価格はレンジ下限で採点し、間取りの複数表記は unknown になる
# （→ 課題#4 手順6・要件定義書 §5.4）。⚠ `unknown_policy` を drop にすると
# これらが「情報が無いだけ」で消える。
#
# ⚠ **`age_years` は使えない**（新築には適用されない metric。書くと validate-config が落ちる）。
# ⚠ **`name:` は変えない**（→ 課題#4）。
# ============================================================

name: "新築一戸建て"
property_type: "SHINCHIKU_KODATE"

# 通知先は中古一戸建てと共有（ファミリ単位 → 課題#4）。
# ⚠⚠ configs/ 直下へ置くのは `scan --seed` の後（→ ADR 0006・chuko_kodate.yaml の注記）
webhook_ref: "KODATE"
digest_webhook_ref: "KODATE_DIGEST"

sites:
  - "SUUMO"

search:
  prefectures:
    - "東京都"
  # 中古一戸建てと同じ3市区（郊外1・23区東西2）。⚠ 新築は八王子で1,007件と多く、
  # バス便が 17/20 と多数派（→ 課題#4 手順8）
  cities:
    - "足立区"
    - "練馬区"
    - "八王子市"
  price_max_hint: null
  # ⚠ サイト側MUST は未測定なので無効（→ chuko_kodate.yaml の注記）
  site_filters:
    enabled: false
    axes: []
    exclude_sites: []

commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

# ---- MUST: 広めに取ってから締める ----
must:
  price_max: 100000000         # 1億円（円単位）
  land_area_min: 40.0
  building_area_min: 50.0
  walk_minutes_max: 20
  layouts: []
  features: []
  unknown_policy: keep

want:
  features: []
  numeric:
    - { metric: price,                weight: 40, best: 40000000, worst: 100000000 }
    - { metric: land_area_sqm,        weight: 15, best: 120,      worst: 40 }
    - { metric: building_area_sqm,    weight: 15, best: 120,      worst: 50 }
    - { metric: walk_minutes,         weight: 10, best: 3,        worst: 20 }
    # ⚠ 通勤の best/worst は母集団（現在の3市区・MUST fail 以外）の下位10%〜上位10%に
    #   合わせた**暫定値**（ユーザー判断 2026-09-07・課題#4 手順8）。賃貸の 25〜60 を流用すると
    #   八王子の掲載が0点に張り付き weight 25 が死ぬ（→ 課題#31）。MUST は置かない
    #   （売買は地域を限定しない判断 → 課題#4）。⚠ 市区を増やしたら付け直すこと。
    - { metric: commute_minutes,      weight: 25, best: 40,       worst: 80 }
    - { metric: flood_rank_avg,       weight: 15, best: 0,        worst: 4 }
    - { metric: landslide_area_ratio, weight: 5,  best: 0,        worst: 0.1 }

ranking:
  top_n: 15
  digest_group: null
  notify_max_rank: 200
