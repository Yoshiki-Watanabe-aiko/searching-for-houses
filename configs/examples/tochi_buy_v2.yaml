# ============================================================
# 検索パターン YAML v2 の雛形（土地売買・Phase 9 → 課題#61・ADR 0024）
#
# ⚠⚠ **この雛形の数値（配点・best/worst・MUST）はすべて暫定である。**
# 4都県の母集団（MUST 通過）を seed で集めてから p10〜p90 に合わせる（→ 課題#31・#34）。
# 価格・土地面積の値は、戸建て（p10 1,780万・p90 7,000万／土地 p10 58・p90 197㎡）から
# 建物代を引いた見当で置いた。
#
# ⚠ **土地には建物の概念が無い。** 間取り（layouts）・専有面積（area_*）・
# 建物面積（building_area_*）・築年数（age_*）は MUST にも WANT にも書けない
# （書くと validate-config が弾く）。相場比（market_rate_ratio）もまだ使えない（→ 9d）。
#
# ⚠ **設備条件（want.features / must.features）は書かない。** 土地の設備抽出辞書が
# まだ無いので、WANT は全件 miss で分母にだけ乗り、MUST は詳細取得済みが全件 fail になる。
# 書くと validate-config が「辞書に無い条件コード」として NG にする（→ 9c で辞書を作る）。
#
# ⚠ `name:` は configs/ 直下へ配置したら変えない（通知履歴・順位・スコアの鍵）。
# ⚠ 直下へ置く前に run_initial_scan.ps1 -ConfigsDir <一時dir> で scan --seed を流す
#   （置いた瞬間から定期スキャンが新規掲載を全件通知する → ADR 0006）。
# ⚠ いまは SUUMO の土地アダプタが無い（→ 9b）。配置しても「アダプタ未実装」と報告されるだけ。
#
# 検証: uv run house-search validate-config --configs-dir <この雛形だけを置いたdir> --skip-webhook
# ============================================================

name: "土地"
property_type: "TOCHI"

# 売買はスコープを分けずファミリ単位で共有する（→ 課題#4 の命名規約）。
# ⚠ Discord のチャンネルは 9e の前に作る（それまでは --skip-webhook で検証する）
webhook_ref: "TOCHI"
digest_webhook_ref: "TOCHI_DIGEST"

sites:
  - "SUUMO"

search:
  prefectures: ["東京都", "千葉県", "埼玉県", "神奈川県"]
  cities: []                   # SUUMO のスラグがある市区へ自動展開する（郡部は未対応 → 課題#61）
  price_max_hint: null
  # ⚠ サイト側MUSTは土地の一覧で実測してから（→ 9b・ADR 0015「推測で書かない」）
  site_filters: { enabled: false, axes: [], exclude_sites: [] }

commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

must:
  price_max: 80000000          # 8,000万円（円単位・暫定）
  land_area_min: 60.0          # 狭小地を外す（暫定）
  walk_minutes_max: 20         # バス便は徒歩 NULL → unknown → keep で通る（→ 課題#58）
  features: []                 # ⚠ 土地の設備辞書が無い間は書かない
  unknown_policy: keep

want:
  features: []                 # ⚠ 同上（全件 miss で分母にだけ乗る）
  numeric:
    - { metric: price,                 weight: 25, best: 15000000, worst: 60000000 }
    - { metric: land_area_sqm,         weight: 25, best: 200,      worst: 80 }
    - { metric: walk_minutes,          weight: 10, best: 3,        worst: 20 }
    - { metric: commute_minutes,       weight: 10, best: 40,       worst: 90 }
    # ハザードは他の売買と同じ配点（購入は住み替えが利かない → ADR 0021・0023）
    - { metric: flood_rank_avg,        weight: 25, best: 0,        worst: 4 }
    - { metric: landslide_area_ratio,  weight: 10, best: 0,        worst: 0.1 }
    - { metric: liquefaction_rank_avg, weight: 10, best: 1,        worst: 4.5 }

ranking:
  top_n: 15
  digest_group: null
  notify_max_rank: 200
