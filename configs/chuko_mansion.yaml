# ============================================================
# 中古マンション（売買・Phase 6）
#
# 2026-09-07 に **東京・千葉・埼玉・神奈川の全域**へ広げ、配点を
# 「通勤を下げ、設備とハザードを上げる」方向へ付け替えた（ユーザー判断 → 課題#4）。
#
# ⚠ **`cities` は空にしてある。** 売買アダプタは `requires_city=True` なので
#   空なら4都県の全市区へ自動展開され、SUUMO のスラグ（`m_city_site_values`）が
#   無い市区は黙って落ちる（実測 173/251 市区。無い市区は収集時に掲載が無かった市区）。
#   ⚠ 賃貸のエリア帯と違い、売買は「相場より安いこと」で見るため帯を持たない。
# ⚠ **weight・best/worst は暫定。** 4都県の母集団で分布を測ってから確定する
#   （→ 課題#31・#34）。⚠ 売買の相場（→ 課題#49）が入るまでは価格の絶対額で
#   採点するので、安い郊外が上位に寄る（→ 課題#24 と同型）ことは承知のうえ。
#
# ⚠ **MUST は「広めに取ってから締める」**（ユーザー判断 2026-09-06）。
# MUST 1段目で fail した掲載はDBに残らないので、**緩める方向は取り直しになる**
# （→ ADR 0013・課題#24）。締める方向は `rescore` だけで試せる。
#
# ⚠ **`name:` は変えない。** 通知履歴・順位・スコアが `pattern_name` に紐づいており、
# 変えると全掲載が「未通知」扱いになり new が全件再発火する（→ 課題#4）。
# ============================================================

name: "中古マンション"
property_type: "CHUKO_MANSION"

# 通知先はファミリ単位で共有する（新築・中古で分けない → 課題#4）。
# ⚠⚠ `.env` の DISCORD_WEBHOOK_MANSION / _MANSION_DIGEST には値が入っている。
#   configs/ 直下に置いた瞬間から定期スキャンが新規掲載を通知として飛ばすので、
#   市区を広げるときは **CONFIGS_DIR を一時ディレクトリへ向けて `scan --seed`** を
#   先に流す（→ ADR 0006）。2026-09-07 の4都県化もこの手順で入れた。
webhook_ref: "MANSION"
digest_webhook_ref: "MANSION_DIGEST"

# ⚠ ライフルホームズは入れない。1実行5リクエストの上限を賃貸と食い合い、
# 市区ローテーションの一巡が 1.4日 → 倍以上に伸びて**取得の鮮度が黙って落ちる**
sites:
  - "SUUMO"

# ---- サイト側へ渡す唯一の条件 ----
search:
  prefectures:
    - "東京都"
    - "千葉県"
    - "埼玉県"
    - "神奈川県"
  # 空＝4都県の全市区（スラグのある173市区）へ自動展開する（上の注記を参照）
  cities: []
  # ⚠ **価格上限はサイトへ渡さない。** `kt` の単位が万円で選択肢が離散
  # （500/1000/…/8000/9000/10000/12000）であることは手順3で実測したが、
  # **丸めが未実装**なので端数を送ると掲載0件になる（→ 課題#29）。
  price_max_hint: null
  # サイト側MUST は**効きを実測した2軸だけ**を有効にしてある（→ ADR 0015）。
  # 面積上限 `mt`・築年数 `cn` は選択肢をフォームから採っただけで効きが未測定、
  # 間取り `md` は複数指定の直列化が未測定なので `data/site_search_params.yaml` 側が
  # `enabled: false`。⚠ 測っていないものは送らない
  site_filters:
    enabled: true
    axes:
      - "area_min"
      - "walk_minutes_max"
    exclude_sites: []

commute:
  destination_station: "芝公園"
  destination_prefecture: "東京都"

# ---- MUST: 未充足なら除外 ----
# ⚠ 広めに取る。`monthly_cost_max` / `age_max` / `commute_minutes_max` / `layouts` は
# **意図的に設定していない**（空リスト・未設定は「制約なし」として MUST 判定から外れる）。
# ⚠ 通勤の MUST は置かない（売買は地域を限定しない判断 → 課題#4）
must:
  price_max: 100000000         # 1億円（円単位）
  area_min: 30.0
  walk_minutes_max: 20
  layouts: []                  # 制約なし。売買の md は部屋数でしか切れない（→ 課題#4）
  features: []
  # ⚠ drop へ倒さないこと。管理費未取得が「情報が無いだけ」で消える
  unknown_policy: keep

# ---- WANT: 重み付き加点。合計 0〜100点へ正規化される ----
# 配点の内訳（2026-09-07・ユーザー判断）: 設備 60 / 価格 40 / 面積 20 / 築年 15 /
# 管理費等 10 / 徒歩 8 / 通勤 10 / ハザード 35（洪水25・土砂10）＝ 198。
# 通勤 25→10・徒歩 10→8 に下げ、その分を設備（40→60）とハザード（20→35）へ回した。
want:
  # ⚠ **出現率は61掲載（3市区）での実測**。4都県に広げたら測り直す（→ 課題#31）。
  # ⚠ **出現率が高すぎる条件は入れない。** ほぼ全件が持つと分母 Σw だけ増えて
  # 全掲載が等しく加点され、順位がまったく動かない（→ 課題#15・#31）。
  # 除外: エレベーター95.1% / 2階以上85.2% / システムキッチン83.6%
  features:
    # 購入後の初期費用に直結する。⚠ **リフォーム済みとリノベは排他グループにする**
    # ——リノベ17件のうち15件（88%）がリフォーム済みも持つので、別々に weight を
    # 振ると同じ属性に二重の重みが掛かる（重複が低ければ分けてよい → ADR 0022）
    - { any_of: [FEAT_REFORMED, FEAT_RENOVATED], weight: 7 }   # 54.1%
    # 後から付けられない共用設備・構造
    - { code: SEC_AUTOLOCK,         weight: 8 }    # 16.4% オートロック
    - { code: STRUCT_QUAKE,         weight: 6 }    #  8.2% 耐震基準適合（ローン控除の要件）
    - { code: HVAC_FLOOR_HEAT,      weight: 6 }    #  8.2% 床暖房
    - { code: EQUIP_DELIVERY_BOX,   weight: 4 }    # 44.3% 宅配ボックス
    # 後から変えられない住戸の条件
    - { code: LOC_CORNER,           weight: 5 }    # 34.4% 角部屋
    - { code: LOC_SOUTH_FACING,     weight: 5 }    # 39.3% 南向き
    # 住み始めるまでの手間・専有部の設備
    - { code: FEAT_VACANT,          weight: 4 }    # 47.5% 現況空家（即引渡し可）
    - { code: KITCHEN_DISHWASHER,   weight: 5 }    # 29.5% 食器洗い乾燥機
    - { code: STORAGE_WIC,          weight: 4 }    # 16.4% ウォークインクローゼット
    # 出現率が高いので軽め（差が付きにくい）
    - { code: SEC_MONITOR_INTERCOM, weight: 3 }    # 78.7% TVモニタ付きインターホン
    - { code: BATH_DRY,             weight: 3 }    # 70.5% 浴室乾燥機
  numeric:
    # best/worst は 4都県 seed 後の母集団（MUST 通過 12,420件・2026-09-08）の
    # p10〜p90 に合わせた（→ 課題#31・#34・課題#4「4都県全域への拡大」）。
    # ⚠ 3市区時代の値（best 4,000万）だと価格の満点が 60%・築年の0点が 34% で配点が死ぬ。
    # ⚠ 価格の weight を 40→20 へ半分にし、空いた 20 を相場比へ回した
    #    （ユーザー判断 2026-09-08「相場より安いことを重視したい」→ 課題#49 Step 6）。
    #    絶対額だけだと安い郊外が満点を取り続け、上位が埼玉県北で埋まる（→ 課題#4）。
    #    ⚠ 予算の上限は MUST の price_max が守るので、下げても予算超過は起きない。
    - { metric: price,                weight: 20, best: 16000000, worst: 68000000 }   # p10 1,590万 / p90 6,790万
    # 相場との比較（→ 課題#49・ADR 0022）。市区の㎡単価相場（国交省「不動産情報
    # ライブラリ」の取引価格）と比べる。⚠ **best/worst を 1.0 中心に置かない**——
    # うちの price は売出価格・相場は取引価格なので母集団は 1.0 をまたぐ。
    # ⚠ 価格との順位相関は r=+0.432（配線前に測ったゲート |r|<0.6 を通過）。
    - { metric: market_rate_ratio,    weight: 20, best: 0.68,     worst: 1.99 }        # p10 0.68 / p90 1.99
    - { metric: area_sqm,             weight: 20, best: 85,       worst: 47 }         # p90 85.4 / p10 47.4
    # 築年は best 0 を保ち worst だけ p90 へ（賃貸の課題#31 と同じ手順）
    - { metric: age_years,            weight: 15, best: 0,        worst: 50 }         # p90 50
    - { metric: monthly_cost,         weight: 10, best: 15000,    worst: 40000 }      # p10 1.6万 / p90 3.7万（据え置き）
    - { metric: walk_minutes,         weight: 8,  best: 3,        worst: 20 }         # 0点 2%・満点 12%（据え置き）
    # 通勤は 25→10 へ（ユーザー判断 2026-09-07）。best/worst は4都県の母集団の p10〜p90
    - { metric: commute_minutes,      weight: 10, best: 35,       worst: 80 }         # p10 34 / p90 80
    # ハザードは全種別で共通に効く（→ ADR 0021）。購入では住み替えが利かないので
    # 賃貸（15＋5）より重くする。⚠ 0 は「区域外だと確認した」で満点、未解決は欠損
    - { metric: flood_rank_avg,       weight: 25, best: 0,        worst: 4 }
    - { metric: landslide_area_ratio, weight: 10, best: 0,        worst: 0.1 }

ranking:
  top_n: 15
  digest_group: null
  notify_max_rank: 200
